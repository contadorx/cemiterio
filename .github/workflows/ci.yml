# =============================================================================
# BUILD 0 — pipeline verde a partir de clone limpo
#
# O critério de saída do Build 0 é: "pipeline verde a partir de clone limpo".
# Por isso aqui usa `npm ci` (respeita o package-lock e falha se ele divergir
# do package.json), e não `npm install`.
#
# A ordem é deliberada: as verificações baratas rodam antes do build, para o
# erro aparecer em segundos em vez de minutos.
#
# Nenhum passo precisa de segredo. O simulador (`npm run testar`) roda contra
# um banco em memória (testes/fake-supabase.ts) — nunca contra o Supabase real.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificações, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # `migrar-limpo` sobe um cluster temporário; o runner do Ubuntu já traz
      # os binários, mas não o servidor.
      - name: PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` apaga node_modules e instala exatamente o lock.
      # É o que prova que o projeto sobe do zero na máquina de outra pessoa.
      - name: Instalar dependências (clone limpo)
        run: npm ci

      # Procura .map/.length/.join sobre dado de fetch sem proteção.
      # Foi este check que pegou o `item.fotos.map` da fila de liberação.
      - name: Verificações estáticas
        run: npm run checar

      # Tipos. O projeto usa muito `any` (achado P2), então isto é um piso,
      # não um teto: não substitui os testes de comportamento.
      - name: TypeScript
        run: npm run tipos

      # 123 verificações executando as funções REAIS de src/lib contra um
      # banco em memória. Sem credencial, sem rede.
      - name: Simulador de operações
        run: npm run testar

      # O REPOSITÓRIO RECONSTRÓI O BANCO?
      #
      # Aplica migrations/ a um PostgreSQL vazio. Este passo já teria pegado,
      # sozinho: a 0051 estourando `ruas.org_id not null` em banco limpo, a
      # tabela `quitacoes` sem `create table`, 32 colunas e 15 funções que só
      # existiam dentro do banco de produção.
      #
      # Nenhum deles aparece em revisão de código. Todos aparecem aqui.
      - name: Migrations em banco limpo
        run: npm run migrar-limpo

      # Build de produção por último: é o passo mais caro.
      - name: Build de produção
        run: npm run build
        env:
          # O build não fala com o Supabase, mas o cliente é construído em
          # tempo de módulo em algumas rotas. Valores de fachada bastam e
          # deixam explícito que NENHUM segredo real entra no CI.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
